name = "pv"
bin = "pv"
description = "Static build of pv, the pipe viewer"
upstream = '''
[pv](https://www.ivarch.com/programs/pv.shtml), the pipe viewer, which shows the
progress of data through a pipe'''
tag = "v1.7.24"
license_short = "Artistic-2.0"
prereq = '''

- `autoconf` (the git tree of pv ships no `configure` script)'''
apt = ["autoconf"]
brew = ["autoconf"]
outputs = '''
- `dist/bin/pv`: the binary; copy it anywhere on your `PATH`
- `dist/share/man/man1/pv.1`: the man page'''
build = '''

echo ">>> pv"
(
  cd pv
  # the dependency scripts of pv take the compiler as a single word, so the compiler is a wrapper
  mkdir -p "$WORK/bin"
  printf '#!/bin/sh\nexec %s "$@"\n' "$CC" >"$WORK/bin/cc"
  chmod +x "$WORK/bin/cc"
  export CC="$WORK/bin/cc"
  ./generate.sh >/dev/null
  # pv 1.7 uses ioctl and splice without declaring them, which current compilers reject
  CFLAGS="-Os -D_GNU_SOURCE -include sys/ioctl.h"
  # macOS has no fdatasync, which pv calls without a fallback
  [ "$OS" = Darwin ] && CFLAGS="$CFLAGS -Dfdatasync=fsync"
  ./configure --disable-nls CFLAGS="$CFLAGS" LDFLAGS="$LDSTATIC -s" >/dev/null
  "$MAKE" -j"$JOBS" pv
  rm -rf "$DIST"
  mkdir -p "$DIST/bin" "$DIST/share/man/man1"
  cp pv "$DIST/bin/pv"
  # the man page is generated by configure
  for page in pv.1 doc/pv.1 doc/quickref.1; do
    [ -f "$page" ] || continue
    cp "$page" "$DIST/share/man/man1/pv.1"
    break
  done
)
'''
version_cmd = "\"$BIN\" --version | sed -n 1p"
tests = '''

version="$("$BIN" --version | sed -n 1p)"
echo "$version" | grep -q '^pv ' || fail "pv --version: $version"
pass "$version"

out="$(head -c 100000 /dev/zero | "$BIN" -q | wc -c | tr -d ' ')"
[ "$out" = 100000 ] || fail "pv passed $out bytes of 100000"
pass "passes data through"

out="$(head -c 4096 /dev/zero | "$BIN" -n -s 4096 2>&1 >/dev/null | tail -n 1)"
[ "$out" = 100 ] || fail "numeric progress: $out"
pass "shows the progress"
'''

[upstream_tags]
pattern = '^v[0-9]+(\.[0-9]+)+$'

[[vendor]]
dir = "pv"
url = "https://github.com/a-j-wood/pv.git"
tag = "v1.7.24"

[[project]]
name = "pv"
url = "https://github.com/a-j-wood/pv"
copyright = "Andrew Wood and contributors"
license = "Artistic License 2.0 (see doc/COPYING in the sources)"
