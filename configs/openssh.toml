name = "openssh"
bin = "ssh"
description = "Static build of the OpenSSH suite and the openssl tool, with OpenSSL and zlib linked in"
upstream = '''
[OpenSSH](https://www.openssh.com/), the secure shell suite (`ssh`, `scp`, `sftp`, `ssh-keygen`,
`ssh-agent`, `ssh-add`, `ssh-keyscan`, and `sshd`) and the `openssl` tool, with [OpenSSL](https://www.openssl.org/) and
[zlib](https://zlib.net/) linked in statically'''
tag = "v10.6p1"
license_short = "BSD-style and ISC (OpenSSH), Apache-2.0 (OpenSSL), and the zlib license"
prereq = '''

- `autoconf` and `automake` (the git tree of OpenSSH ships no `configure` script), and `perl` (for OpenSSL)'''
apt = ["autoconf", "automake"]
brew = ["autoconf", "automake"]
extra = '''

All tools are a single binary, `bin/ssh`, that runs as the tool whose name it is called with (like
BusyBox), so that OpenSSL and zlib are linked in once. The other names in `bin`, `sbin`, and
`libexec` are symlinks to it, so copy or link the names that you need together with `ssh`, or
use the symlinks of the archive; called by a name that is not a tool, it prints a message and exits.

The build has no PAM, no Kerberos, no SELinux, and no built-in FIDO support (security keys work
through a `SecurityKeyProvider`). `scp` and `sftp` start the `ssh` found in `PATH`, not one at a
compiled-in path.

`openssl` is another name of the binary, with TLS (`s_client`, `s_server`) but without the
commands for OCSP, time stamps, CMS, DSA, and the legacy ciphers (Blowfish, CAST, RC2, RC4, IDEA,
SEED, Camellia, and ARIA). Its configuration and certificates are in `/etc/ssl`; hosts without
`/etc/ssl/openssl.cnf` get `share/openssl/openssl.cnf` of the archive, which `openssl req` needs.

`sshd` is built, but not configured: it needs a host key and a config file (`-h`, `-f`). It starts
`sshd-session` and `sshd-auth` from the prefix it was compiled for, so point it to `libexec` with
`-o SshdSessionPath=...` and `-o SshdAuthPath=...`. The system config of `ssh` is `/etc/ssh`, and
`-F` selects another file.
'''
dirs = "bin sbin libexec share"
outputs = '''
- `dist/bin/ssh`: the binary with all tools; copy it anywhere on your `PATH`, and the tools you
  need as symlinks to it (`scp`, `sftp`, `ssh-add`, `ssh-agent`, `ssh-keygen`, `ssh-keyscan`,
  `openssl`)
- `dist/sbin/sshd`: a symlink for the server
- `dist/libexec`: symlinks for the parts of `sshd` and the helper programs of the suite
- `dist/share/openssl/openssl.cnf`: the configuration of `openssl` for hosts without one
- `dist/share/man`: the man pages'''
build = '''

# drops unused functions at link time
GC_CFLAGS="-ffunction-sections -fdata-sections"
GC_LDFLAGS="-Wl,--gc-sections"
[ "$OS" = Darwin ] && GC_LDFLAGS="-Wl,-dead_strip"

echo ">>> zlib"
(
  cd zlib
  CFLAGS="-Os $GC_CFLAGS" ./configure --static --prefix="$PREFIX" >/dev/null
  "$MAKE" -j"$JOBS" libz.a
  "$MAKE" install >/dev/null
)

echo ">>> openssl"
(
  cd openssl
  [ -f Makefile ] && "$MAKE" distclean >/dev/null 2>&1 || true
  # OpenSSH only needs libcrypto, the openssl tool also libssl; without legacy and rarely used parts
  ./Configure no-shared no-dso no-tests no-docs no-module no-engine no-legacy no-comp \
    no-ocsp no-ts no-cms no-srp no-psk no-ct no-sctp no-quic no-srtp \
    no-dsa no-ec2m no-rfc3779 no-gost no-idea no-seed no-rc2 no-rc4 no-rc5 no-md2 no-md4 no-mdc2 \
    no-whirlpool no-bf no-cast no-camellia no-aria no-sm2 no-sm3 no-sm4 no-cmac no-siphash \
    --prefix="$PREFIX" --libdir=lib --openssldir=/etc/ssl CC="$CC" AR="$AR" RANLIB="$RANLIB" \
    CFLAGS="-Os $GC_CFLAGS" >/dev/null
  "$MAKE" -j"$JOBS" build_libs >/dev/null
  # the objects of the openssl tool, which is linked into the binary of OpenSSH
  "$MAKE" -j"$JOBS" apps/openssl >/dev/null
  "$MAKE" install_dev >/dev/null
)

echo ">>> openssh"
(
  cd openssh
  # the copy of the sources has new timestamps, which make a shipped configure stale
  autoreconf -fi >/dev/null 2>&1
  [ -f Makefile ] && "$MAKE" distclean >/dev/null 2>&1 || true
  LIBS=""
  [ "$OS" = Linux ] && LIBS="-lpthread"
  ./configure --prefix=/usr/local --sysconfdir=/etc/ssh --with-ssl-dir="$PREFIX" \
    --with-zlib="$PREFIX" --without-pam --without-selinux --without-kerberos5 --disable-strip \
    CFLAGS="-Os $GC_CFLAGS" CPPFLAGS="-I$PREFIX/include" \
    LDFLAGS="$LDSTATIC -L$PREFIX/lib $GC_LDFLAGS -s" LIBS="$LIBS" >/dev/null
  # scp and sftp run the ssh of the prefix, which the archive is not at, so they use PATH
  "$MAKE" -j"$JOBS" SSH_PROGRAM=ssh >/dev/null
  rm -rf "$DIST"
  mkdir -p "$DIST/bin" "$DIST/sbin" "$DIST/libexec"

  # one binary with all tools, which links libcrypto and zlib once; the tools are symlinks to it
  # and run by the name they are called with. Each tool is linked to a single object with the
  # parts of libssh it needs, whose symbols are local but its main, as the tools define globals
  # with the same names, and libssh calls functions that each tool defines in its own way.
  MULTI="$WORK/multi"
  rm -rf "$MULTI"
  mkdir -p "$MULTI"
  # shellcheck disable=SC2016
  printf 'print-%%:\n\t@echo $($*)\n' >"$MULTI/print.mk"
  var() { "$MAKE" -s -f Makefile -f "$MULTI/print.mk" "print-$1" 2>/dev/null; }
  TOOLS="ssh:SSHOBJS sshd:SSHDOBJS sshd-session:SSHD_SESSION_OBJS sshd-auth:SSHD_AUTH_OBJS"
  TOOLS="$TOOLS scp:SCP_OBJS sftp:SFTP_OBJS sftp-server:SFTPSERVER_OBJS ssh-add:SSHADD_OBJS"
  TOOLS="$TOOLS ssh-agent:SSHAGENT_OBJS ssh-keygen:SSHKEYGEN_OBJS ssh-keyscan:SSHKEYSCAN_OBJS"
  TOOLS="$TOOLS ssh-keysign:SSHKEYSIGN_OBJS ssh-pkcs11-helper:P11HELPER_OBJS"
  TOOLS="$TOOLS ssh-sk-helper:SKHELPER_OBJS openssl:-"
  {
    echo 'int main(int, char **);'
    for entry in $TOOLS; do echo "int ${entry%%:*}_multi_main(int, char **);" | tr - _; done
    echo '#include <string.h>'
    echo '#include <stdio.h>'
    echo 'static const struct { const char *name; int (*main)(int, char **); } tools[] = {'
    for entry in $TOOLS; do
      name="${entry%%:*}"
      echo "  { \"$name\", $(echo "$name" | tr - _)_multi_main },"
    done
    echo '};'
    cat <<'EOF'
#include <limits.h>
#include <stdlib.h>
#include <unistd.h>
#ifdef __APPLE__
#include <mach-o/dyld.h>
#endif

/* openssl req needs a config file, which hosts without OpenSSL lack, so it falls back to the one
   in share/openssl of the package, found from the real path of this binary in bin */
static void default_config(void) {
  char exe[PATH_MAX], real[PATH_MAX], conf[PATH_MAX], *slash;
  if (getenv("OPENSSL_CONF") || access("/etc/ssl/openssl.cnf", R_OK) == 0)
    return;
#ifdef __APPLE__
  uint32_t size = sizeof(exe);
  if (_NSGetExecutablePath(exe, &size) != 0)
    return;
#else
  ssize_t length = readlink("/proc/self/exe", exe, sizeof(exe) - 1);
  if (length <= 0)
    return;
  exe[length] = '\0';
#endif
  if (!realpath(exe, real))
    return;
  for (int level = 0; level < 2; level++) {
    if (!(slash = strrchr(real, '/')))
      return;
    *slash = '\0';
  }
  snprintf(conf, sizeof(conf), "%s/share/openssl/openssl.cnf", real);
  if (access(conf, R_OK) == 0)
    setenv("OPENSSL_CONF", conf, 0);
}

int main(int argc, char **argv) {
  const char *name = argc > 0 ? strrchr(argv[0], '/') : NULL;
  name = name ? name + 1 : (argc > 0 ? argv[0] : "");
  for (unsigned i = 0; i < sizeof(tools) / sizeof(tools[0]); i++)
    if (strcmp(name, tools[i].name) == 0) {
      if (strcmp(name, "openssl") == 0)
        default_config();
      return tools[i].main(argc, argv);
    }
  fprintf(stderr, "multi-call OpenSSH binary, run it as one of its tools by name\n");
  return 1;
}
EOF
  } >"$MULTI/multi.c"
  objects=""
  for entry in $TOOLS; do
    name="${entry%%:*}"
    [ "$name" = openssl ] && continue
    sym="$(echo "$name" | tr - _)_multi_main"
    # shellcheck disable=SC2046
    if [ "$OS" = Linux ]; then
      ld -r -o "$MULTI/$name.o" $(var "${entry##*:}") -L. -Lopenbsd-compat \
        --start-group -lssh -lopenbsd-compat --end-group
      # the thunks of retpoline are shared by name
      objcopy --redefine-sym "main=$sym" --keep-global-symbol="$sym" \
        --keep-global-symbol=__llvm_retpoline_r11 "$MULTI/$name.o"
    else
      # the file of main is compiled again with another name for it
      main_file="$name-main"
      [ "$name" = sftp-server ] || main_file="$name"
      rm -f "$main_file.o"
      "$MAKE" "$main_file.o" SSH_PROGRAM=ssh CFLAGS="$(var CFLAGS) -Dmain=$sym" >/dev/null
      ld -r -o "$MULTI/$name.o" -exported_symbol "_$sym" $(var "${entry##*:}") \
        -L. -Lopenbsd-compat -lssh -lopenbsd-compat
      # the export list may not be applied to objects, then nmedit makes the others local
      if [ "$(nm -gU "$MULTI/$name.o" | grep -c ' T \| D \| S \| B ')" != 1 ]; then
        echo "_$sym" >"$MULTI/$name.exports"
        nmedit -s "$MULTI/$name.exports" "$MULTI/$name.o"
      fi
    fi
    objects="$objects $MULTI/$name.o"
  done
  # the openssl tool, from its objects and the libraries they need
  OSSL="$WORK/src/openssl"
  if [ "$OS" != Linux ]; then
    rm -f "$OSSL/apps/openssl-bin-openssl.o"
    "$MAKE" -C "$OSSL" apps/openssl-bin-openssl.o CPPFLAGS="-Dmain=openssl_multi_main" >/dev/null
  fi
  OSSL_OBJS="$(cd "$OSSL" && find apps -name 'openssl-bin-*.o' | sort | sed "s|^|$OSSL/|")"
  # shellcheck disable=SC2086
  if [ "$OS" = Linux ]; then
    ld -r -o "$MULTI/openssl.o" $OSSL_OBJS "$OSSL/apps/libapps.a" "$OSSL/libssl.a"
    objcopy --redefine-sym main=openssl_multi_main --keep-global-symbol=openssl_multi_main \
      --keep-global-symbol=__llvm_retpoline_r11 "$MULTI/openssl.o"
  else
    ld -r -o "$MULTI/openssl.o" -exported_symbol _openssl_multi_main $OSSL_OBJS \
      "$OSSL/apps/libapps.a" "$OSSL/libssl.a"
    if [ "$(nm -gU "$MULTI/openssl.o" | grep -c ' T \| D \| S \| B ')" != 1 ]; then
      echo _openssl_multi_main >"$MULTI/openssl.exports"
      nmedit -s "$MULTI/openssl.exports" "$MULTI/openssl.o"
    fi
  fi
  objects="$objects $MULTI/openssl.o"
  # shellcheck disable=SC2046,SC2086
  $CC -O2 -o "$DIST/bin/ssh" "$MULTI/multi.c" $objects $LDSTATIC -L"$PREFIX/lib" \
    $GC_LDFLAGS -s $(var LIBS) $(var SSHDLIBS) $(var CHANNELLIBS)
  for entry in $TOOLS; do
    name="${entry%%:*}"
    case "$name" in
      ssh) ;;
      sshd) ln -s ../bin/ssh "$DIST/sbin/$name" ;;
      scp | sftp | ssh-add | ssh-agent | ssh-keygen | ssh-keyscan | openssl) ln -s ssh "$DIST/bin/$name" ;;
      *) ln -s ../bin/ssh "$DIST/libexec/$name" ;;
    esac
  done

  mkdir -p "$DIST/share/openssl"
  cp "$OSSL/apps/openssl.cnf" "$DIST/share/openssl/openssl.cnf"
  for section in 1 5 8; do
    mkdir -p "$DIST/share/man/man$section"
    cp ./*."$section" "$DIST/share/man/man$section/"
  done
)
'''
version_cmd = "\"$BIN\" -V 2>&1"
tests = '''

version="$("$BIN" -V 2>&1)"
echo "$version" | grep -q '^OpenSSH_' || fail "ssh -V: $version"
pass "$version"

for tool in scp sftp ssh-add ssh-agent ssh-keygen ssh-keyscan; do
  test -x "$DIST/bin/$tool" || fail "$tool is missing"
done
test -x "$DIST/sbin/sshd" || fail "sshd is missing"
pass "has the suite"

# keys of all types, and a signature that verifies
for type in ed25519 ecdsa rsa; do
  "$DIST/bin/ssh-keygen" -q -t "$type" -N '' -f "$TMP/key-$type" || fail "ssh-keygen -t $type"
done
echo pmg >"$TMP/data"
"$DIST/bin/ssh-keygen" -Y sign -q -f "$TMP/key-ed25519" -n test "$TMP/data" || fail "sign"
echo "pmg $(cat "$TMP/key-ed25519.pub")" >"$TMP/signers"
"$DIST/bin/ssh-keygen" -Y verify -f "$TMP/signers" -I pmg -n test -s "$TMP/data.sig" \
  <"$TMP/data" >/dev/null || fail "verify"
pass "generates keys, signs, and verifies"

# the openssl tool makes a certificate, and speaks TLS with its own server
ossl="$DIST/bin/openssl"
"$ossl" version | grep -q '^OpenSSL ' || fail "openssl version"
"$ossl" req -x509 -newkey ed25519 -nodes -keyout "$TMP/tls.key" -out "$TMP/tls.crt" \
  -subj /CN=localhost -days 1 >"$TMP/req.log" 2>&1 || fail "openssl req: $(cat "$TMP/req.log")"
"$ossl" x509 -in "$TMP/tls.crt" -noout -subject | grep -q CN=localhost || fail "openssl x509"
pass "makes a certificate with openssl"
tls_port=$((40000 + $$ % 20000))
"$ossl" s_server -accept "$tls_port" -cert "$TMP/tls.crt" -key "$TMP/tls.key" -naccept 1 -quiet \
  >/dev/null 2>&1 &
tls_pid=$!
out=""
for _ in 1 2 3 4 5; do
  sleep 1
  out="$(echo | "$ossl" s_client -connect "127.0.0.1:$tls_port" -brief 2>&1)" && break
done
kill "$tls_pid" 2>/dev/null || true
case "$out" in *TLSv1.3*) ;; *) fail "openssl s_client: $out" ;; esac
pass "speaks TLS with openssl s_server and s_client"

# connects to a local sshd as the current user, runs a command, and copies a file through sftp
if [ "$(id -u)" != 0 ]; then
  cp "$TMP/key-ed25519.pub" "$TMP/authorized_keys"
  chmod 600 "$TMP/authorized_keys"
  port=$((20000 + $$ % 20000))
  cat >"$TMP/sshd_config" <<EOF
Port $port
ListenAddress 127.0.0.1
HostKey $TMP/key-rsa
AuthorizedKeysFile $TMP/authorized_keys
PidFile $TMP/sshd.pid
StrictModes no
PasswordAuthentication no
Subsystem sftp $DIST/libexec/sftp-server
EOF
  # sshd starts its parts from the compiled-in prefix, which the archive is not at
  "$DIST/sbin/sshd" -f "$TMP/sshd_config" -o "SshdSessionPath=$DIST/libexec/sshd-session" \
    -o "SshdAuthPath=$DIST/libexec/sshd-auth" -E "$TMP/sshd.log" || fail "sshd: $(cat "$TMP/sshd.log")"
  trap 'kill "$(cat "$TMP/sshd.pid" 2>/dev/null)" 2>/dev/null; rm -rf "$TMP"' EXIT
  PATH="$DIST/bin:$PATH"
  opts="-F /dev/null -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i $TMP/key-ed25519 -o Port=$port"
  # shellcheck disable=SC2086
  out="$("$BIN" $opts 127.0.0.1 echo pmg-ssh 2>/dev/null)" || fail "ssh failed: $(cat "$TMP/sshd.log")"
  [ "$out" = pmg-ssh ] || fail "ssh output: $out"
  pass "runs a command through ssh"
  # shellcheck disable=SC2086
  "$DIST/bin/sftp" -v $opts -b - 127.0.0.1 >"$TMP/sftp.log" 2>&1 <<EOF || fail "sftp failed: $(tail -n 25 "$TMP/sftp.log") $(tail -n 10 "$TMP/sshd.log")"
get $TMP/data $TMP/data.copy
EOF
  [ "$(cat "$TMP/data.copy")" = pmg ] || fail "sftp copy: $(cat "$TMP/data.copy")"
  pass "copies a file through sftp"
fi
'''

[upstream_tags]
pattern = "^V_[0-9]+_[0-9]+_P[0-9]+$"
release_sed = 's/^V_\([0-9]*\)_\([0-9]*\)_P\([0-9]*\)$/v\1.\2p\3/'

[[vendor]]
dir = "openssh"
url = "https://github.com/openssh/openssh-portable.git"
tag = "V_10_6_P1"

[[vendor]]
dir = "openssl"
url = "https://github.com/openssl/openssl.git"
tag = "openssl-3.5.9"

[[vendor]]
dir = "zlib"
url = "https://github.com/madler/zlib.git"
tag = "v1.3.2"

[[project]]
name = "OpenSSH"
url = "https://www.openssh.com/"
copyright = "Tatu Ylonen, Theo de Raadt, Markus Friedl, and the OpenSSH developers"
license = "BSD-style and ISC (see LICENCE in the sources)"

[[project]]
name = "OpenSSL"
url = "https://www.openssl.org/"
copyright = "The OpenSSL Project Authors"
license = "Apache-2.0 (see LICENSE.txt in the sources)"

[[project]]
name = "zlib"
url = "https://zlib.net/"
copyright = "Jean-loup Gailly and Mark Adler"
license = "zlib license"
